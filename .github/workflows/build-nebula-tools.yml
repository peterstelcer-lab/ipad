name: Build Nebula Tools iPad iOS12
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NewUtilities/**'
      - '.github/workflows/build-nebula-tools.yml'
jobs:
  compile:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Native ARM64 compile for three apps
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for app in Commander Media Weather; do mkdir -p "stage/$app/Applications/$app.app"; done
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=12.0 -fobjc-arc -fblocks -O2 -framework UIKit -framework Foundation -framework QuartzCore NewUtilities/iCommander.m -o stage/Commander/Applications/Commander.app/Commander
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=12.0 -fobjc-arc -fblocks -O2 -framework UIKit -framework Foundation -framework QuartzCore -framework AVKit -framework AVFoundation NewUtilities/NebulaMedia.m -o stage/Media/Applications/Media.app/Media
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=12.0 -fobjc-arc -fblocks -O2 -framework UIKit -framework Foundation -framework QuartzCore -framework SafariServices NewUtilities/SHMUWeather.m -o stage/Weather/Applications/Weather.app/Weather
          for app in Commander Media Weather; do
            cp "NewUtilities/$app.plist" "stage/$app/Applications/$app.app/Info.plist"
            lipo -info "stage/$app/Applications/$app.app/$app"
          done
          brew install ldid
          ldid -SNewUtilities/entitlements.plist stage/Commander/Applications/Commander.app/Commander
          ldid -SNewUtilities/entitlements.plist stage/Media/Applications/Media.app/Media
          ldid -S stage/Weather/Applications/Weather.app/Weather
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-compiled-apps
          path: stage/
  package:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nebula-compiled-apps
          path: stage
      - name: Create installable .deb packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          for app in Commander Media Weather; do
            mkdir -p "stage/$app/DEBIAN"
            echo "Package: sk.nebula.$(echo "$app" | tr 'A-Z' 'a-z')" > "stage/$app/DEBIAN/control"
            echo "Name: Nebula $app" >> "stage/$app/DEBIAN/control"
            echo "Version: 1.0-1" >> "stage/$app/DEBIAN/control"
            echo "Architecture: iphoneos-arm" >> "stage/$app/DEBIAN/control"
            echo "Maintainer: Nebula Projects" >> "stage/$app/DEBIAN/control"
            echo "Section: Applications" >> "stage/$app/DEBIAN/control"
            echo "Description: Native iPad iOS 12 app" >> "stage/$app/DEBIAN/control"
            chmod 755 "stage/$app/Applications/$app.app/$app"
            dpkg-deb --build --root-owner-group "stage/$app" "output/Nebula_$app""_iPad_V1.deb"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Nebula_3_Apps_iPad_V1_DEB
          path: output/*.deb
          retention-days: 30
