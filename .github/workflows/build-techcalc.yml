name: Build TechCalc iPad V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'Apps/TechCalc/**'
      - '.github/workflows/build-techcalc.yml'
jobs:
  compile:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Compile native iOS 12 TechCalc and icon
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p stage/Applications/TechCalc.app
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=12.0 -fobjc-arc -O2 \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            Apps/TechCalc/main.m Apps/TechCalc/Scientific.m Apps/TechCalc/Units.m -o stage/Applications/TechCalc.app/TechCalc
          cp Apps/TechCalc/Info.plist stage/Applications/TechCalc.app/Info.plist
          swift Apps/TechCalc/GenerateIcon.swift stage/Applications/TechCalc.app
          test -s stage/Applications/TechCalc.app/AppIcon76@2x.png
          lipo -info stage/Applications/TechCalc.app/TechCalc
          brew install ldid
          ldid -S stage/Applications/TechCalc.app/TechCalc
      - uses: actions/upload-artifact@v4
        with:
          name: TechCalc_iPad_V2_app
          path: stage/
          retention-days: 7
  package:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TechCalc_iPad_V2_app
          path: stage
      - name: Build TechCalc rootful DEB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/DEBIAN output
          cat > stage/DEBIAN/control <<'CONTROL'
          Package: sk.techcalc.ipad
          Name: TechCalc iPad
          Version: 2.0-1
          Architecture: iphoneos-arm
          Maintainer: TechCalc
          Section: Applications
          Priority: optional
          Depends: firmware (>= 12.0)
          Description: Native iOS12 calculator with simple/scientific modes, graph and units converter
          CONTROL
          chmod 755 stage/Applications stage/Applications/TechCalc.app stage/Applications/TechCalc.app/TechCalc
          dpkg-deb --build --root-owner-group stage output/TechCalc_iPad_V2_rootful.deb
          dpkg-deb --info output/*.deb
          dpkg-deb --contents output/*.deb | grep AppIcon76
      - uses: actions/upload-artifact@v4
        with:
          name: TechCalc_iPad_V2_DEB
          path: output/TechCalc_iPad_V2_rootful.deb
          retention-days: 30
