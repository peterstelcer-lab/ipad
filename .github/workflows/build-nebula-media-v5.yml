name: Build Nebula Media Player V5 for iOS 12
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'NewUtilities/NebulaMediaV5.m'
      - '.github/workflows/build-nebula-media-v5.yml'
  push:
    branches: [main]
    paths:
      - 'NewUtilities/NebulaMediaV5.m'
      - 'NewUtilities/Media.plist'
      - '.github/workflows/build-nebula-media-v5.yml'
jobs:
  compile:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile and sign Media Player V5 with MobileVLCKit
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          curl -fL --retry 3 --connect-timeout 30 -o "$RUNNER_TEMP/MobileVLCKit.tar.xz" "https://download.videolan.org/pub/cocoapods/prod/MobileVLCKit-3.6.0-c73b779f-dd8bfdba.tar.xz"
          mkdir -p "$RUNNER_TEMP/vlc" stage/Applications/Media.app/Frameworks
          tar -xJf "$RUNNER_TEMP/MobileVLCKit.tar.xz" -C "$RUNNER_TEMP/vlc"
          VLC_FRAME="$(find "$RUNNER_TEMP/vlc" -type d -path "*/ios-arm64_armv7_armv7s/MobileVLCKit.framework" | head -1)"
          test -d "$VLC_FRAME"
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=12.0 -fobjc-arc -fblocks -O2 -ObjC -F "$(dirname "$VLC_FRAME")" \
            -framework MobileVLCKit -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            -framework MediaPlayer -framework AVKit -framework AVFoundation -framework Security -framework CFNetwork \
            -framework AudioToolbox -framework OpenGLES -framework VideoToolbox -framework CoreVideo \
            -framework CoreMedia -framework CoreText -lc++ -lxml2 -lz -lbz2 -liconv \
            -Wl,-rpath,@executable_path/Frameworks \
            NewUtilities/NebulaMediaV5.m -o stage/Applications/Media.app/Media
          cp -R "$VLC_FRAME" stage/Applications/Media.app/Frameworks/
          cp NewUtilities/Media.plist stage/Applications/Media.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 5.0' stage/Applications/Media.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 5' stage/Applications/Media.app/Info.plist
          lipo -info stage/Applications/Media.app/Media
          brew install ldid
          ldid -SNewUtilities/entitlements.plist stage/Applications/Media.app/Media
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-media-v5-stage
          path: stage/
          retention-days: 7
  package:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nebula-media-v5-stage
          path: stage
      - name: Build rootful DEB package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/DEBIAN output
          cat > stage/DEBIAN/control <<'CONTROL'
          Package: sk.nebula.media
          Name: Nebula Media Player
          Version: 5.0-1
          Architecture: iphoneos-arm
          Maintainer: Nebula Projects
          Section: Applications
          Priority: optional
          Depends: firmware (>= 12.0)
          Description: Native iPad media player with VLC decoding, speed, audio tracks and fullscreen gestures
          CONTROL
          cat > stage/DEBIAN/postinst <<'POST'
          #!/bin/sh
          command -v uicache >/dev/null 2>&1 && uicache -a >/dev/null 2>&1 || true
          exit 0
          POST
          chmod 755 stage/DEBIAN/postinst stage/Applications/Media.app/Media
          dpkg-deb --build --root-owner-group stage output/Nebula_Media_iPad_V5.deb
          dpkg-deb --info output/Nebula_Media_iPad_V5.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Nebula_Media_iPad_V5_DEB
          path: output/Nebula_Media_iPad_V5.deb
          retention-days: 30
