name: Build Nebula Tools iPad iOS12 V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NewUtilities/**'
      - '.github/workflows/build-nebula-tools.yml'
jobs:
  compile:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Native ARM64 compile for three apps
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for app in Commander Media Weather; do mkdir -p "stage/$app/Applications/$app.app"; done
          echo "Downloading VLC decoder for AVI, MKV, MPEG and other codecs"
          curl -fL --retry 3 --connect-timeout 30 -o "$RUNNER_TEMP/MobileVLCKit.tar.xz" "https://download.videolan.org/pub/cocoapods/prod/MobileVLCKit-3.6.0-c73b779f-dd8bfdba.tar.xz"
          mkdir -p "$RUNNER_TEMP/vlc"
          tar -xJf "$RUNNER_TEMP/MobileVLCKit.tar.xz" -C "$RUNNER_TEMP/vlc"
          VLC_FRAME="$(find "$RUNNER_TEMP/vlc" -type d -path "*/ios-arm64_armv7_armv7s/MobileVLCKit.framework" | head -1)"
          test -d "$VLC_FRAME"
          echo "VLC framework: $VLC_FRAME"
          file "$VLC_FRAME/MobileVLCKit"
          ls -lh "$VLC_FRAME/MobileVLCKit"
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=12.0 -fobjc-arc -fblocks -O2 -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics NewUtilities/iCommander.m -o stage/Commander/Applications/Commander.app/Commander
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=12.0 -fobjc-arc -fblocks -O2 -ObjC -F "$(dirname "$VLC_FRAME")" \
            -framework MobileVLCKit -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            -framework AVKit -framework AVFoundation -framework Security -framework CFNetwork \
            -framework AudioToolbox -framework OpenGLES -framework VideoToolbox -framework CoreVideo \
            -framework CoreMedia -framework CoreText -lc++ -lxml2 -lz -lbz2 -liconv \
            -Wl,-rpath,@executable_path/Frameworks \
            NewUtilities/NebulaMedia.m -o stage/Media/Applications/Media.app/Media
          mkdir -p stage/Media/Applications/Media.app/Frameworks
          if file "$VLC_FRAME/MobileVLCKit" | grep -q "dynamically linked"; then cp -R "$VLC_FRAME" stage/Media/Applications/Media.app/Frameworks/; fi
          VLC_LICENSE="$(find "$RUNNER_TEMP/vlc" -name COPYING.txt | head -1 || true)"
          if [ -n "$VLC_LICENSE" ]; then cp "$VLC_LICENSE" stage/Media/Applications/Media.app/VLC-LICENSE.txt; fi
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=12.0 -fobjc-arc -fblocks -O2 -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -framework SafariServices NewUtilities/SHMUWeather.m -o stage/Weather/Applications/Weather.app/Weather
          for app in Commander Media Weather; do
            cp "NewUtilities/$app.plist" "stage/$app/Applications/$app.app/Info.plist"
            lipo -info "stage/$app/Applications/$app.app/$app"
          done
          brew install ldid
          ldid -SNewUtilities/entitlements.plist stage/Commander/Applications/Commander.app/Commander
          ldid -SNewUtilities/entitlements.plist stage/Media/Applications/Media.app/Media
          ldid -S stage/Weather/Applications/Weather.app/Weather
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-compiled-apps
          path: stage/
  package:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nebula-compiled-apps
          path: stage
      - name: Create installable .deb packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          for app in Commander Media Weather; do
            mkdir -p "stage/$app/DEBIAN"
            echo "Package: sk.nebula.$(echo "$app" | tr 'A-Z' 'a-z')" > "stage/$app/DEBIAN/control"
            echo "Name: Nebula $app" >> "stage/$app/DEBIAN/control"
            echo "Version: 3.0-1" >> "stage/$app/DEBIAN/control"
            echo "Architecture: iphoneos-arm" >> "stage/$app/DEBIAN/control"
            echo "Maintainer: Nebula Projects" >> "stage/$app/DEBIAN/control"
            echo "Section: Applications" >> "stage/$app/DEBIAN/control"
            echo "Description: Native iPad iOS 12 app" >> "stage/$app/DEBIAN/control"
            cat > "stage/$app/DEBIAN/postinst" <<'POST'
          #!/bin/sh
          command -v uicache >/dev/null 2>&1 && uicache -a >/dev/null 2>&1 || true
          exit 0
          POST
            chmod 755 "stage/$app/DEBIAN/postinst"
            chmod 755 "stage/$app/Applications/$app.app/$app"
            dpkg-deb --build --root-owner-group "stage/$app" "output/Nebula_$app""_iPad_V3.deb"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Nebula_3_Apps_iPad_V3_DEB
          path: output/*.deb
          retention-days: 30
